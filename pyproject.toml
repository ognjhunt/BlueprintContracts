[project]
name = "blueprint-contracts"
version = "0.1.0"
description = "Shared handoff, site-world, runtime-layer, and canonical package contracts for Blueprint"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Blueprint Team" }]
keywords = ["blueprint", "contracts", "handoff", "site-world", "runtime-layer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Repository = "https://github.com/ognjhunt/BlueprintContracts"
Changelog = "https://github.com/ognjhunt/BlueprintContracts/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ognjhunt/BlueprintContracts/tree/main/docs"

[dependency-groups]
dev = [
    "build>=1.2.2",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blueprint_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
